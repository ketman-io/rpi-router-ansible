---
- name: reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: reload bind9
  ansible.builtin.command: /usr/sbin/rndc reload
  changed_when: true

- name: restart bind9
  ansible.builtin.systemd_service:
    name: named
    state: restarted

- name: restart isc-dhcp-server
  ansible.builtin.systemd_service:
    name: isc-dhcp-server
    state: restarted
