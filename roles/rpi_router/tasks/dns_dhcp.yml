---
# router_mode: dhcp_dns — this Pi is the LAN's only DHCP/DNS server.
# BIND forwards recursively over native DNS-over-TLS; there is no local DNS
# proxy anywhere in the chain.

- name: Ensure dnsmasq is not installed (would conflict with bind9/isc-dhcp-server)
  ansible.builtin.apt:
    name: dnsmasq
    state: absent
    purge: true

- name: Ensure Stubby is not installed
  ansible.builtin.apt:
    name: stubby
    state: absent
    purge: true
    autoremove: true

- name: Install BIND and isc-dhcp-server
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
      - bind9-dnsutils
      - isc-dhcp-server
      - ca-certificates
    state: present

- name: Deploy named.conf.options (native DoT upstream)
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0640"
    backup: true
    validate: /usr/sbin/named-checkconf %s
  notify: reload bind9

- name: Deploy dhcpd.conf
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/sbin/dhcpd -t -cf %s
  notify: restart isc-dhcp-server

- name: Restrict isc-dhcp-server to the LAN bridge only (never listen on WAN)
  ansible.builtin.lineinfile:
    path: /etc/default/isc-dhcp-server
    regexp: '^INTERFACESv4='
    line: 'INTERFACESv4="{{ lan_bridge }}"'
    create: true
  notify: restart isc-dhcp-server

- name: Enable and start BIND
  ansible.builtin.systemd_service:
    name: named
    enabled: true
    state: started

# named and isc-dhcp-server are never restarted in the same handler flush —
# each service's own handler fires independently, and a validated config is
# a precondition for either restart (the `validate:` parameters above), so a
# bad render never reaches a running daemon.
- name: Apply BIND changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start isc-dhcp-server
  ansible.builtin.systemd_service:
    name: isc-dhcp-server
    enabled: true
    state: started

- name: Apply DHCP changes now
  ansible.builtin.meta: flush_handlers
