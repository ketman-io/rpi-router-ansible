---
- name: Enable IPv4 forwarding, persistently
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-rpi-router-forwarding.conf
    reload: true

- name: Enable IPv6 forwarding, persistently
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-rpi-router-forwarding.conf
    reload: true
