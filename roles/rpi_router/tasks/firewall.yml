---
# Native nftables. No iptables-nft compatibility layer, no legacy `iptables`
# Ansible module. Debian Trixie ships nftables as the default and iptables
# only via the compatibility package, and this role does not install that
# package.
#
# Tailscale manages its own packet-filtering (it detects nftables and
# creates its own top-level tables/chains independent of this ruleset) — see
# the template's comments for what this role does to stay out of its way.

# Whether the hairpin hole (forward LAN->LAN plus masquerade to
# dns_redirect_target specifically) is even needed. It is real, necessary
# NAT — not "broader than necessary" — only when the redirect target sits
# on the LAN's own subnet, the case that actually needed it live (see
# nftables.conf.j2's own comment). A target reachable only via WAN needs
# no special rule at all: the ordinary LAN->WAN forward rule and the
# general WAN masquerade already cover it, and adding the LAN->LAN hole in
# that case would be exactly the kind of NAT rule wider than the situation
# calls for.
- name: Determine whether the DNS redirect target is on the LAN's own subnet
  ansible.builtin.set_fact:
    rpi_router_dns_redirect_hairpin_needed: >-
      {{ (dns_redirect_target is ansible.utils.in_network(lan_cidr)) if (dns_redirect_enabled | bool) else false }}

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Enable and start the nftables service (loads /etc/nftables.conf at boot)
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Install the fleet ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: /usr/sbin/nft -c -f %s
  notify: reload nftables

- name: Apply immediately (not only at next boot)
  ansible.builtin.meta: flush_handlers
