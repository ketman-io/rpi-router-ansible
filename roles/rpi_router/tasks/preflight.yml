---
# Fail fast on configuration mistakes that would otherwise show up as a
# confusing runtime failure four tasks later — e.g. a bridge silently
# containing the WAN port, or a DNS mode with no target to redirect to.

- name: Assert manage_dns and dns_redirect_enabled are not both set
  ansible.builtin.assert:
    that:
      - not ((manage_dns | bool) and (dns_redirect_enabled | bool))
    fail_msg: >-
      manage_dns and dns_redirect_enabled cannot both be true — a router
      cannot both BE the DNS server and redirect LAN DNS traffic to a
      different one. Pick one.

- name: Assert dns_redirect_target is set when dns_redirect_enabled
  ansible.builtin.assert:
    that:
      - dns_redirect_target | length > 0
    fail_msg: >-
      dns_redirect_enabled is true but dns_redirect_target is empty. Set it
      to the address of the resolver LAN clients should actually reach.
  when: dns_redirect_enabled | bool

- name: Assert DDNS has at least one dynamic zone to update when enabled
  ansible.builtin.assert:
    that:
      - dns_authoritative_zones | selectattr('dynamic', 'defined') | selectattr('dynamic') | list | length > 0
    fail_msg: >-
      dns_ddns_enabled is true but no entry in dns_authoritative_zones has
      dynamic: true. DDNS with nothing to update is not a useful
      configuration.
  when: dns_ddns_enabled | bool

- name: Assert dhcp_domain_name is set when this router's own dhcpd does DDNS
  ansible.builtin.assert:
    that:
      - dhcp_domain_name | length > 0
    fail_msg: >-
      dns_ddns_enabled and manage_dhcp are both true, but dhcp_domain_name
      is empty. dhcpd needs it to construct DDNS update names
      (ddns-domainname).
  when:
    - dns_ddns_enabled | bool
    - manage_dhcp | bool

- name: Assert a DDNS secret was actually supplied when DDNS is enabled
  ansible.builtin.assert:
    that:
      - dns_ddns_key_secret | length > 0
    fail_msg: >-
      dns_ddns_enabled is true but dns_ddns_key_secret is empty. Generate
      one with `tsig-keygen -a hmac-sha256 {{ dns_ddns_key_name }}` and
      supply it via --extra-vars, an Ansible Vault file, or your own
      secret manager — never hard-code it in group_vars. Refusing to
      render a DDNS config with no key material.
  when: dns_ddns_enabled | bool
  no_log: true

- name: Assert lan_ifaces is a non-empty list
  ansible.builtin.assert:
    that:
      - lan_ifaces is iterable
      - lan_ifaces | length > 0
    fail_msg: lan_ifaces must list at least one LAN interface.

- name: Assert wan_iface is not also listed as a LAN interface
  ansible.builtin.assert:
    that:
      - wan_iface not in lan_ifaces
    fail_msg: >-
      wan_iface ('{{ wan_iface }}') also appears in lan_ifaces. That would
      bridge the WAN uplink into the LAN switch.

- name: Assert lan_bridge does not collide with a physical interface name
  ansible.builtin.assert:
    that:
      - lan_bridge != wan_iface
      - lan_bridge not in lan_ifaces
    fail_msg: >-
      lan_bridge ('{{ lan_bridge }}') collides with a physical interface
      name. Pick a distinct bridge name (default br0).

- name: Assert lan_cidr looks like a network address, not a host address
  ansible.builtin.assert:
    that:
      - "'/' in lan_cidr"
      - lan_cidr != (lan_ip ~ '/' ~ lan_prefix)
    fail_msg: >-
      lan_cidr ('{{ lan_cidr }}') should be the LAN's network address (e.g.
      192.168.1.0/24), not lan_ip with a prefix appended. It is used for
      firewall matches and as the default Tailscale-advertised route, and
      Tailscale rejects a route with host bits set.

- name: Warn if the target OS is not the tested Trixie/Debian 13 generation
  ansible.builtin.debug:
    msg: >-
      This role targets Raspberry Pi OS / Debian Trixie (13). Detected
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      ({{ ansible_facts.distribution_release }}). Proceeding, but package
      names, NetworkManager behaviour and nftables persistence were only
      verified on Trixie — see README.md.
  when: ansible_facts.distribution_release | default('') != 'trixie'
