---
# The router's OWN DNS resolution — not what it serves to clients, but what
# it uses itself for outbound lookups (apt, NTP hostnames, etc). One
# intentional path, no hidden alternate one.
#
# The root cause of a real idempotence bug, found running this live against
# piroute25: setting ipv4.ignore-auto-dns on the WAN connection is not
# enough. NetworkManager's default DNS plugin ("dns=" unset in
# NetworkManager.conf, which means "default") still assembles
# /etc/resolv.conf itself from EVERY active connection's effective DNS
# settings, and IPv6 router advertisements on the WAN interface — a
# separate setting, ipv6.ignore-auto-dns, never touched by the earlier
# version of this role — kept injecting an IPv6 nameserver from the ISP
# router into that assembly. The result: NM regenerated /etc/resolv.conf
# out from under this role's own copy task, and every subsequent converge
# reported it changed again, correctly, because it genuinely differed from
# what NM had just rewritten it to.
#
# Chasing every per-connection ignore-auto-dns flag (WAN's IPv4 one, WAN's
# IPv6 one, the bridge's, each slave's) is exactly the whack-a-mole this
# role should not encode. The actual fix is at the source: tell
# NetworkManager not to manage /etc/resolv.conf at all. Once dns=none is
# set, this role's own copy task is the file's only writer, on this host,
# ever — which is the point of a role that manages DNS resolution in the
# first place.

- name: Disable systemd-resolved if present
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: false
    state: stopped
  failed_when: false
  register: rpi_router_resolved_disabled
  changed_when: rpi_router_resolved_disabled is not failed and rpi_router_resolved_disabled.changed | default(false)

- name: Stop NetworkManager from writing /etc/resolv.conf itself
  community.general.ini_file:
    path: /etc/NetworkManager/NetworkManager.conf
    section: main
    option: dns
    value: "none"
    mode: "0644"
  notify: reload NetworkManager

- name: Apply the NetworkManager DNS-management change now
  ansible.builtin.meta: flush_handlers

- name: Determine this router's own resolver
  ansible.builtin.set_fact:
    rpi_router_own_resolver: >-
      {{ '127.0.0.1' if router_mode == 'dhcp_dns'
         else (dns_redirect_target if router_mode == 'dns_redirect' else '') }}

- name: Point this router's own resolution at its resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by rpi_router (Ansible).
      nameserver {{ rpi_router_own_resolver }}
    owner: root
    group: root
    mode: "0644"
  when: rpi_router_own_resolver != ''
