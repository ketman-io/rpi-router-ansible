# Defaults for the rpi_router role.
#
# Everything here is generic. No real addresses, hostnames or credentials
# belong in this file or anywhere else in this repository — see README.md.
# Fill in real values in your own inventory/group_vars, kept outside of
# version control (or in a private repository) if they describe a real site.

# --- WAN ---
# The interface facing the upstream ISP/router. Always DHCP.
wan_iface: eth0

# --- LAN ---
# One or more interfaces to bridge together as the LAN switch. A single
# interface is fine (the bridge is still created, with one slave); this is
# what makes multi-port hardware like the Waveshare PCIE TO 4-CH 2.5G ETH
# Board a matter of listing more interfaces, not a special code path.
#
# Do not assume the kernel names USB/PCIe Ethernet adapters predictably
# (e.g. "eth1".."eth4"). Discover the real names on the target hardware first
# — see docs/hardware-waveshare-4port.md — and list them explicitly here, or
# by stable udev-assigned name if you have set one up.
lan_ifaces:
  - eth1

# The bridge that owns the LAN IP configuration. Never assign lan_ip to one
# of the slave interfaces directly.
lan_bridge: br0

# Bridge STP is off by default: this is a flat single-segment LAN switch, not
# a network with redundant paths that need loop protection. Turn it on if
# your topology actually has a loop.
lan_bridge_stp: false

lan_ip: 192.168.1.1
lan_prefix: 24
# Dotted-decimal form of lan_prefix, required by isc-dhcp-server's
# dhcpd.conf syntax. Kept as an explicit variable rather than computed from
# lan_prefix so this role has no dependency on the ansible.utils/netaddr
# collection — just make sure the two agree.
lan_netmask: 255.255.255.0
# The LAN network in CIDR form — the network address, not lan_ip (e.g.
# 192.168.1.0/24, not 192.168.1.1/24). Used for firewall matches and as the
# default Tailscale-advertised route. Set this explicitly rather than
# relying on arithmetic on lan_ip/lan_prefix: a role that gets this wrong
# silently advertises or matches the wrong network.
lan_cidr: 192.168.1.0/24

# --- PCIe (Raspberry Pi 5 + Waveshare or similar PCIe NIC hardware) ---
# Raspberry Pi 5 PCIe is off by default. Only needed on hardware that
# actually has a PCIe Ethernet card; harmless to leave enabled otherwise.
enable_pcie: true
# Deliberately Gen2 only — see docs/hardware-waveshare-4port.md. Do not set
# this true unless your PCIe hardware benefits from Gen3 and is validated at
# that speed; it provides no benefit for the Waveshare board this role was
# built against.
pcie_gen3: false
boot_config_path: /boot/firmware/config.txt

# --- Router DHCP/DNS capabilities ---
#
# DHCP and DNS are independent capabilities, not a single mode string.
# Two real deployments taught this: one site's router (piroute25-shaped)
# runs neither — DHCP/DNS live on a dedicated host elsewhere, and this
# router only redirects/enforces; another site's router (the Grey-Winters
# shape) is small and remote enough that it is more sensible for the
# router to run DHCP AND DNS itself, including authoritative zones and
# DDNS. "Router + DHCP only" and "Router + DNS only" are real, useful
# combinations too — a site might already run BIND elsewhere but want this
# box to hand out leases, or vice versa. Compose the two booleans rather
# than picking from a matrix of named modes.
manage_dhcp: false
manage_dns: false

# dns_redirect is a THIRD, independent thing, not a fallback mode of the
# two above: even when this router runs neither DHCP nor DNS, it can still
# transparently redirect LAN-originated port-53 traffic (UDP+TCP) to
# dns_redirect_target, so clients get the intended resolver even if they
# ignore the DHCP-advertised one or hardcode a public one. This is what a
# dedicated DNS/DHCP host elsewhere generally wants alongside
# manage_dhcp/manage_dns both false. Mutually exclusive with manage_dns —
# a router cannot both BE the DNS server and redirect to a different one.
dns_redirect_enabled: false
dns_redirect_target: ""

# --- DHCP (used only when manage_dhcp: true) ---
# Kept intentionally small; extend per site as needed. Matches common
# small-site conventions: a modest dynamic pool, LAN gateway/DNS server
# both self.
dhcp_range_start: 192.168.1.100
dhcp_range_end: 192.168.1.200
dhcp_default_lease_time: 600
dhcp_max_lease_time: 7200
dhcp_domain_name: ""
dhcp_ntp_servers: []

# --- DNS (used only when manage_dns: true) ---
#
# Each upstream provider's address(es) are validated against ITS OWN
# tls_hostname only, never mixed with another provider's. See
# templates/named.conf.options.j2 — this is what keeps a Cloudflare address
# from ever being checked against Google's certificate name or vice versa.
dns_upstream_providers:
  - name: cloudflare
    addresses:
      - 1.1.1.1
      - 1.0.0.1
    tls_hostname: cloudflare-dns.com

# Optional authoritative zones this router's BIND should also serve — the
# self-contained remote-site shape (DHCP + authoritative DNS + recursive
# DNS + DDNS all on one box), demonstrated architecturally by a real
# small-site deployment. Empty by default: most routers are recursive-only.
# Example:
#   dns_authoritative_zones:
#     - name: example.internal
#       file: /etc/bind/zones/db.example.internal
#       dynamic: true          # updated via DDNS from dhcpd — see below
#     - name: 1.168.192.in-addr.arpa
#       file: /etc/bind/zones/db.192.168.1
#       dynamic: true
dns_authoritative_zones: []

# DDNS: dhcpd registers leases into the zones above via a shared TSIG key.
# Only meaningful when dns_authoritative_zones is non-empty and at least
# one zone has dynamic: true. The secret itself is never set here — supply
# it via --extra-vars, an Ansible Vault file, or your own secret manager,
# generated with `tsig-keygen -a hmac-sha256 <key-name>`. This role refuses
# to proceed with dns_ddns_enabled: true and an empty secret rather than
# silently rendering a config with no key material.
dns_ddns_enabled: false
dns_ddns_key_name: DDNS_UPDATE
dns_ddns_key_algorithm: hmac-sha256
dns_ddns_key_secret: ""

# --- Tailscale ---
#
# Off by default. A router is not inherently a Tailscale node any more
# than any other host is — Tailscale is an optional capability this role
# supports, never one it implies. Enable explicitly per deployment.
manage_tailscale: false
tailscale_advertise_exit_node: false
# Advertised subnet route when enabled. Defaults to the LAN CIDR; override
# to advertise something else (or nothing, by setting this to "").
tailscale_advertise_routes: "{{ lan_cidr }}"
# tailscale_authkey must be supplied via a secrets file that is NOT
# committed (see secrets.sample.yml) or via --extra-vars / a vault. Never
# hard-code a real key in group_vars.
tailscale_authkey: ""
# Set true only if you have opened this port on your upstream
# router/ISP box and want to help Tailscale find a direct (non-DERP) path.
# Leaving it closed still works — Tailscale falls back to relayed
# connections — it is just not as fast. Off by default: this role's default
# posture is "no inbound WAN service", full stop.
tailscale_allow_wan_udp: false
tailscale_udp_port: 41641

# Backwards compatibility with older variable names. If you set these, they
# are mapped onto the variables above so existing group_vars files keep
# working without edits. New deployments should use the variables above
# directly. See README.md "Upgrading from older versions".
# lan_iface: eth0
# lan_netmask: 255.255.255.0
# dns_server: 192.168.1.10
# use_internal_dns_dhcp: true
# router_mode: dhcp_dns   # dhcp_dns | dns_redirect | passthrough
