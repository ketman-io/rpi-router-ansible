# Copy to secrets.yml (gitignored) and fill in. Never commit real values.
#
# Only needed if you actually use the corresponding feature:
#   tailscale_authkey    - only if manage_tailscale: true
#   dns_ddns_key_secret   - only if dns_ddns_enabled: true. Generate with:
#                             tsig-keygen -a hmac-sha256 <dns_ddns_key_name>
#                           and paste just the secret (the base64 value
#                           after `secret "` in tsig-keygen's own output).

tailscale_authkey: "ADD_YOUR_KEY_HERE"
dns_ddns_key_secret: "ADD_YOUR_TSIG_SECRET_HERE"
