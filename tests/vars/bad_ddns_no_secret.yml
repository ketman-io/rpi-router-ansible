wan_iface: eth0
lan_ifaces: [eth1]
lan_bridge: br0
lan_ip: 192.168.1.1
lan_prefix: 24
lan_cidr: 192.168.1.0/24
manage_dhcp: false
manage_dns: true
dns_redirect_enabled: false
dns_redirect_target: ""
dns_ddns_enabled: true
dns_ddns_key_name: DDNS_UPDATE
dns_ddns_key_secret: ""
dns_authoritative_zones:
  - name: example.internal
    file: /etc/bind/zones/db.example.internal
    dynamic: true
dhcp_domain_name: "example.internal"
