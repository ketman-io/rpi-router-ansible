# Example values — replace for your own site. See README.md "Variables" and
# roles/rpi_router/defaults/main.yml for the full list and explanations.

wan_iface: eth0
lan_ifaces:
  - eth1
  - eth2
  - eth3
  - eth4
lan_bridge: br0

lan_ip: 192.168.1.1
lan_prefix: 24
lan_netmask: 255.255.255.0
lan_cidr: 192.168.1.0/24        # the NETWORK address, not lan_ip

# dhcp_dns  - this Pi runs its own DHCP + DNS (native BIND DoT)
# dns_redirect - an existing host already serves DHCP/DNS; this router only
#                redirects LAN port-53 traffic to it (dns_redirect_target)
# passthrough  - this Pi does nothing about DNS/DHCP at all
router_mode: dhcp_dns
dns_redirect_target: ""

dns_upstream_providers:
  - name: cloudflare
    addresses:
      - 1.1.1.1
      - 1.0.0.1
    tls_hostname: cloudflare-dns.com

tailscale_advertise_exit_node: true
tailscale_advertise_routes: "{{ lan_cidr }}"
